<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskmanager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232f4bdb'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <span class="brand">Taskmanager</span>
      <span class="health" id="health" data-state="unknown">Vérification du service…</span>
    </header>

    <main>
      <section class="summary" aria-labelledby="counter">
        <h1 class="counter" id="counter">Chargement…</h1>
        <div class="progress" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-label" id="progress-label"></p>
      </section>

      <form class="composer" id="composer" novalidate>
        <label class="visually-hidden" for="new-title">Titre de la tâche</label>
        <div class="composer-row">
          <input id="new-title" name="title" type="text" maxlength="100" autocomplete="off"
                 placeholder="Que faut-il faire ?" required>
          <button type="submit" class="button-primary">Ajouter</button>
        </div>
        <label class="visually-hidden" for="new-description">Description</label>
        <textarea id="new-description" name="description" rows="2" maxlength="500"
                  placeholder="Détails, lien, échéance… (facultatif)"></textarea>
      </form>

      <nav class="filters" aria-label="Filtrer les tâches">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">Toutes <span data-count="all">0</span></button>
        <button type="button" class="filter" data-filter="todo" aria-pressed="false">À faire <span data-count="todo">0</span></button>
        <button type="button" class="filter" data-filter="done" aria-pressed="false">Terminées <span data-count="done">0</span></button>
      </nav>

      <ul class="tasks" id="tasks" aria-live="polite"></ul>
      <p class="empty" id="empty" hidden></p>
    </main>

    <footer class="footer">
      API REST sur <code>/api/tasks</code>, état sur <code>/actuator/health</code>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
